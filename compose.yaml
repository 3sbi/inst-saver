services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.1
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
      - story-media:/media:ro

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    environment:
      INSTAGRAM_HANDLE: ${INSTAGRAM_HANDLE:?Set INSTAGRAM_HANDLE in .env}
      TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL:?Set TELEGRAM_CHANNEL in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
    volumes:
      - worker-data:/data
      - story-media:/media

volumes:
  worker-data:
  story-media:
  telegram-data:
